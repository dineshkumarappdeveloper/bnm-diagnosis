# ─────────────────────────────────────────────────────────────────────────────
# BNM Diagnosis — Release Pipeline
#
# TRIGGER: push a branch named `release/<x.y.z>` (e.g. release/1.0.0), or run
# manually ("Run workflow") with a version.
#
# WHERE THE DOWNLOADS GO: the PUBLIC `bnmadmin-releases` repo — the same shelf
# BNM Admin and BNM Billing already publish to, so every BNM desktop app is
# downloadable from one place. Published as TWO releases:
#   • diagnosis-v<x.y.z>  versioned history
#   • diagnosis-latest    rolling tag whose assets are replaced each release —
#                         bnmapp.com links /releases/download/diagnosis-latest/…
#                         so the website never needs editing for a new version.
# NEITHER is ever marked "latest". The repo's /releases/latest belongs to
# BNMAdmin, whose site links use /releases/latest/download/ — stealing it would
# 404 every "Download for Windows" button on bnmapp.com. Same discipline as
# BNM Billing's billing-latest.
#
# ── REQUIRED SETUP (one-time, on THIS repo) ──────────────────────────────────
# Settings → Secrets and variables → Actions → Secrets:
#   RELEASE_TOKEN   A PAT with `contents: write` on
#                   dineshkumarappdeveloper/bnmadmin-releases.
#                   The same token BNMAdmin already uses — copy its value across;
#                   secrets are per-repo and are NOT inherited.
#
# Nothing else. There is no Play/App Store leg here: BNM Diagnosis is
# desktop-first and its mobile targets are secondary, so this pipeline ships
# installers only.
#
# WHY NO SIGNING: the DMG is unsigned (no Apple Developer ID configured), so
# macOS Gatekeeper will warn on first open — right-click → Open, or
# `xattr -dr com.apple.quarantine /Applications/BNMDiagnosis.app`. The MSI is
# likewise unsigned and SmartScreen may warn. Add certificates here when the lab
# product starts shipping to third parties.
# ─────────────────────────────────────────────────────────────────────────────

name: Release Pipeline

on:
  push:
    branches: ['release/**', 'release-**']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

concurrency:
  group: release-${{ github.ref }}
  # TRUE, unlike the sibling pipelines: a re-push of the same release branch is
  # always a deliberate retry of a run that went wrong. Leaving it false queued
  # the retry behind a cancelled run whose macOS jobs had not been reaped, so
  # neither ever ran. Publishing is idempotent (the rolling tag replaces assets),
  # so superseding is safe here.
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  # ── Resolve version + tag ──────────────────────────────────────────────────
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.v.outputs.version_name }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            RAW="$INPUT_VERSION"
          else
            RAW="${REF_NAME##*/}"          # release/1.2.0 -> 1.2.0
          fi
          # Strip a stray leading v and validate: jpackage rejects anything that
          # is not strictly x.y.z, and it fails LATE (after a full build), so
          # catch it here instead of burning four runners.
          RAW="${RAW#v}"
          if ! printf '%s' "$RAW" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must be x.y.z (got '$RAW'). Branch should look like release/1.0.0"
            exit 1
          fi
          echo "version_name=$RAW" >> "$GITHUB_OUTPUT"
          echo "tag=diagnosis-v$RAW" >> "$GITHUB_OUTPUT"
          echo "Releasing BNM Diagnosis $RAW as tag diagnosis-v$RAW"

  # ── Desktop installers ─────────────────────────────────────────────────────
  desktop:
    name: Desktop ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    # ARM64 Linux is best-effort — if the runner class is unavailable it must not
    # block the Windows/macOS/x64 release.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        # NO macos-13 (Intel) leg — matching BNM Billing. It was tried and
        # removed: macos-13 is being retired and its runners do not schedule.
        # Runs 1 and 3 both had EVERY other target green with macos-x64 still
        # QUEUED, which blocked publish-desktop entirely. `experimental: true`
        # does NOT rescue this — continue-on-error covers a job that FAILS, not
        # one that never STARTS, and GitHub only reaps a queued job after ~24h.
        # Intel Macs are served by the portable .jar.
        include:
          - name: windows-x64
            os: windows-latest
            task: packageMsi
            glob: composeApp/build/compose/binaries/main/msi/*.msi
            asset: BNMDiagnosis-windows-x64.msi
          - name: macos-arm64
            os: macos-14              # Apple Silicon
            task: packageDmg
            glob: composeApp/build/compose/binaries/main/dmg/*.dmg
            asset: BNMDiagnosis-macos-arm64.dmg
          - name: linux-x64-deb
            os: ubuntu-latest
            task: packageDeb
            glob: composeApp/build/compose/binaries/main/deb/*.deb
            asset: BNMDiagnosis-linux-x64.deb
          - name: portable-jar
            os: ubuntu-latest
            task: packageUberJarForCurrentOS
            glob: composeApp/build/compose/jars/*.jar
            asset: BNMDiagnosis-portable.jar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Build installer (${{ matrix.task }})
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version_name }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew || true
          echo "BNM Diagnosis desktop version: $VERSION"
          ./gradlew :composeApp:${{ matrix.task }} --no-daemon --stacktrace -PappVersion="$VERSION"

      - name: Rename to stable asset name
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          file=$(ls ${{ matrix.glob }} | head -n1)
          echo "Packaged: $file"
          cp "$file" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          # Intra-run hand-off to publish-desktop only — the real artifacts live on
          # the releases repo. The 90-day default would pile up installers and eat
          # the Actions storage quota.
          retention-days: 1

  # ── Publish to the shared public downloads repo ────────────────────────────
  publish-desktop:
    name: Publish desktop installers
    needs: [prepare, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -lh dist

      # Checksums so the IN-APP UPDATER can verify what it downloaded before
      # handing it to the OS. The installers are unsigned, so this file is the
      # only integrity evidence there is — without it the app would be executing
      # a binary it cannot check.
      - name: Publish checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      # Versioned release — history. NEVER marked latest: the shared repo's
      # /releases/latest belongs to BNMAdmin's site links, and stealing it would
      # 404 every "Download for Windows" button on bnmapp.com.
      - name: Publish versioned release (diagnosis-v*)
        uses: softprops/action-gh-release@v2
        with:
          repository: dineshkumarappdeveloper/bnmadmin-releases
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: BNM Diagnosis ${{ needs.prepare.outputs.version_name }}
          make_latest: 'false'
          body: |
            **BNM Diagnosis** — offline-first diagnostic laboratory (LIMS) — ${{ needs.prepare.outputs.tag }}

            | Platform | Download |
            |---|---|
            | Windows 10/11 (x64) | `BNMDiagnosis-windows-x64.msi` |
            | macOS (Apple Silicon) | `BNMDiagnosis-macos-arm64.dmg` |
            | macOS (Intel) | use the portable `.jar` below |
            | Linux (x64, Debian/Ubuntu) | `BNMDiagnosis-linux-x64.deb` |
            | Any OS with a JRE | `BNMDiagnosis-portable.jar` |

            These builds are **unsigned**. On macOS, first launch needs
            right-click → Open (or `xattr -dr com.apple.quarantine /Applications/BNMDiagnosis.app`).
            On Windows, SmartScreen may ask you to confirm via "More info → Run anyway".

            The app is offline-first: it runs with no network at all. A licence key
            is required once, at activation.
          files: dist/*
          fail_on_unmatched_files: true

      # Rolling release — the STABLE URLs bnmapp.com links to:
      #   /releases/download/diagnosis-latest/BNMDiagnosis-<platform>.<ext>
      # Same-named assets are replaced on each publish, so the website never
      # needs editing for a new version. Same pattern as billing-latest.
      - name: Update rolling diagnosis-latest release
        uses: softprops/action-gh-release@v2
        with:
          repository: dineshkumarappdeveloper/bnmadmin-releases
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: diagnosis-latest
          name: BNM Diagnosis (latest)
          make_latest: 'false'
          body: |
            Always-current BNM Diagnosis desktop installers (updated by every release).
            Versioned history lives in the diagnosis-v* releases.
          files: dist/*
          fail_on_unmatched_files: true

  summary:
    name: Summary
    needs: [prepare, publish-desktop]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
            echo "## BNM Diagnosis ${{ needs.prepare.outputs.tag }}"
            echo ""
            echo "| Leg | Result |"
            echo "|---|---|"
            echo "| bnmadmin-releases (Desktop) | ${{ needs.publish-desktop.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
