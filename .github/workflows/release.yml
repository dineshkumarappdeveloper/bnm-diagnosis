# ─────────────────────────────────────────────────────────────────────────────
# BNM Diagnosis — Release Pipeline
#
# TRIGGER: push any branch named `release/<x.y.z>` (e.g. release/1.0.0), or run
# manually ("Run workflow") with a version. One push fans out to:
#   1. bnmadmin-releases  (desktop installers: Windows/macOS/Linux/Pi/jar)
#   2. Google Play — GATED behind repo variable ENABLE_PLAY=true (the Play app
#      is still a draft; the API can't create the FIRST release anyway, so
#      finish the console handoff + one manual rollout, then flip the variable)
#   3. iOS App Store — COMING SOON (placeholder, skipped)
#
# DESKTOP PUBLISHING — same repo as BNMAdmin (bnmadmin-releases), two releases:
#   • billing-v<x.y.z>   versioned history (make_latest:false so BNMAdmin's
#                        /releases/latest/... links NEVER break)
#   • billing-latest     rolling tag whose assets are replaced each release —
#                        bnmapp.com links /releases/download/billing-latest/…
#                        for stable always-current URLs.
#
# VERSIONING: versionName parsed from branch (release/1.2.0 → 1.2.0);
# versionCode = major*10000 + minor*100 + patch. Desktop gets -PappVersion.
#
# ── REQUIRED SETUP ───────────────────────────────────────────────────────────
# Repo SECRETS:
#   RELEASE_TOKEN            PAT that can create releases on bnmadmin-releases
#                            (same value as the BNMAdmin repo's RELEASE_TOKEN).
#   -- only when ENABLE_PLAY=true --
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON  Play API service account (grant it the
#                                     com.bnm.diagnosis app in Play Console).
#   ANDROID_KEYSTORE_BASE64           base64 of release.keystore (upload key).
#   RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD
#                            build.gradle.kts reads these from env when
#                            keystore.properties is absent (CI path).
# Repo VARIABLES (optional): ENABLE_PLAY, PLAY_TRACK (default production),
#   PLAY_STATUS (default completed).
# ─────────────────────────────────────────────────────────────────────────────

name: Release Pipeline

on:
  push:
    branches: ['release/**', 'release-**']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  # ── Resolve versionName / versionCode / release tag ────────────────────────
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.v.outputs.version_name }}
      version_code: ${{ steps.v.outputs.version_code }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            RAW="$INPUT_VERSION"
          else
            RAW="${REF_NAME##*/}"     # release/1.2.0 -> 1.2.0
            RAW="${RAW#release-}"     # release-1.2.0 -> 1.2.0
          fi
          NAME=$(echo "$RAW" | grep -oE '[0-9]+(\.[0-9]+){0,2}' | head -1)
          NAME=${NAME:-1.0.0}
          IFS='.' read -r MAJ MIN PAT <<< "$NAME"
          CODE=$(( ${MAJ:-1} * 10000 + ${MIN:-0} * 100 + ${PAT:-0} ))
          echo "version_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          # billing- prefix keeps tags disjoint from BNMAdmin's v* in the shared
          # bnmadmin-releases repo.
          echo "tag=billing-v$NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved → versionName=$NAME  versionCode=$CODE  tag=billing-v$NAME"

  # ── 1. Desktop installers → bnmadmin-releases ──────────────────────────────
  desktop:
    name: Desktop ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            task: packageMsi
            glob: composeApp/build/compose/binaries/main/msi/*.msi
            asset: BNMDiagnosis-windows-x64.msi
          - name: macos-arm64
            os: macos-14            # Apple Silicon
            task: packageDmg
            glob: composeApp/build/compose/binaries/main/dmg/*.dmg
            asset: BNMDiagnosis-macos-arm64.dmg
          - name: linux-x64-deb
            os: ubuntu-latest
            task: packageDeb
            glob: composeApp/build/compose/binaries/main/deb/*.deb
            asset: BNMDiagnosis-linux-x64.deb
          - name: linux-arm64-deb
            os: ubuntu-24.04-arm
            task: packageDeb
            glob: composeApp/build/compose/binaries/main/deb/*.deb
            asset: BNMDiagnosis-linux-arm64.deb
            experimental: true
          - name: portable-jar
            os: ubuntu-latest
            task: packageUberJarForCurrentOS
            glob: composeApp/build/compose/jars/*.jar
            asset: BNMDiagnosis-portable.jar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Build installer (${{ matrix.task }})
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version_name }}
        run: |
          chmod +x ./gradlew || true
          echo "Desktop app version: $VERSION"
          ./gradlew :composeApp:${{ matrix.task }} --no-daemon --stacktrace -PappVersion="$VERSION"

      - name: Rename to stable asset name
        shell: bash
        run: |
          mkdir -p dist
          file=$(ls ${{ matrix.glob }} | head -n1)
          echo "Packaged: $file"
          cp "$file" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          # Intra-run hand-off to the publish job only; the real installers live
          # on the bnmadmin-releases Releases. Default 90-day retention piles up
          # and exhausts the shared Actions artifact-storage quota.
          retention-days: 1

  publish-desktop:
    name: Publish desktop installers
    needs: [prepare, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -lh dist

      # Versioned release — history. NEVER marked latest: the shared repo's
      # /releases/latest belongs to BNMAdmin's site links.
      - name: Publish versioned release (billing-v*)
        uses: softprops/action-gh-release@v2
        with:
          repository: dineshkumarappdeveloper/bnmadmin-releases
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: BNM Diagnosis ${{ needs.prepare.outputs.tag }}
          make_latest: 'false'
          body: |
            BNM Diagnosis desktop installers — ${{ needs.prepare.outputs.tag }}
            • Windows (.msi) · macOS (Apple Silicon .dmg) · Linux (.deb) · Raspberry Pi (arm64 .deb) · portable .jar
          files: dist/*
          fail_on_unmatched_files: true

      # Rolling release — stable download URLs for bnmapp.com:
      #   /releases/download/billing-latest/BNMDiagnosis-<platform>.<ext>
      # Same-named assets are replaced on each publish.
      - name: Update rolling billing-latest release
        uses: softprops/action-gh-release@v2
        with:
          repository: dineshkumarappdeveloper/bnmadmin-releases
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: billing-latest
          name: BNM Diagnosis (latest)
          make_latest: 'false'
          body: |
            Always-current BNM Diagnosis desktop installers (updated by every release).
            Versioned history lives in the billing-v* releases.
          files: dist/*
          fail_on_unmatched_files: true

  # ── 2. Android → Google Play (gated until the Play draft is finished) ──────
  android-play:
    name: Android → Google Play
    needs: prepare
    if: ${{ vars.ENABLE_PLAY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore upload keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Build signed AAB
        shell: bash
        env:
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew || true
          ./gradlew :composeApp:bundleRelease --no-daemon --stacktrace \
            -PplayVersionCode=${{ needs.prepare.outputs.version_code }} \
            -PplayVersionName=${{ needs.prepare.outputs.version_name }}

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.bnm.diagnosis
          releaseFiles: composeApp/build/outputs/bundle/release/*.aab
          track: ${{ vars.PLAY_TRACK || 'production' }}
          status: ${{ vars.PLAY_STATUS || 'completed' }}

  # ── 3. iOS → App Store (COMING SOON) ───────────────────────────────────────
  ios-appstore:
    name: iOS → App Store (coming soon)
    needs: prepare
    if: ${{ false }}
    runs-on: macos-14
    steps:
      - run: echo "iOS App Store publishing is coming soon."

  notify:
    name: Summary
    needs: [prepare, publish-desktop]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
            echo "## BNM Diagnosis release ${{ needs.prepare.outputs.tag }} (versionCode ${{ needs.prepare.outputs.version_code }})"
            echo ""
            echo "| Target | Result |"
            echo "|--------|--------|"
            echo "| bnmadmin-releases (Desktop) | ${{ needs.publish-desktop.result }} |"
            echo "| Google Play (Android) | ${{ vars.ENABLE_PLAY == 'true' && 'triggered' || 'gated (ENABLE_PLAY unset)' }} |"
            echo "| App Store (iOS) | coming soon |"
          } >> "$GITHUB_STEP_SUMMARY"
