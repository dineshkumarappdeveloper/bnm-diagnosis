# BNM Lab remote-support relay.
#
# One Worker, two Durable Object classes:
#   LabSession       — one per support session (id = idFromName(session_id));
#                      holds ≤ 1 lab socket + ≤ 1 support socket and pipes
#                      text frames verbatim between them.
#   SessionDirectory — one global instance (idFromName("v1")); maps the hash of
#                      the spoken code to a session id and rate-limits joins.
#
# Secrets (wrangler secret put …, or .dev.vars locally — see .dev.vars.example):
#   BNM_SUPPORT_TOKEN       required — bearer token the engineer's bridge sends
#   LAB_LICENSE_PUBLIC_JWK  optional — overrides the licence public key in
#                           src/keys.ts (the E2E starts dev with the TEST key)
#   HELLO_TIMEOUT_MS        optional — how long a fresh socket may stay silent
#                           before it is closed (default 10000)
#
# Deploy: `npm run deploy` (wrangler deploy). Never from a feature branch.

name = "bnm-lab-relay"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# The app dials THIS host and nothing else: `Constants.REMOTE_RELAY_URL` in the
# lab app is `wss://lab-relay.bnmapp.com`, compiled into every installer, and a
# shipped build cannot be talked out of it. Without this binding `wrangler
# deploy` would publish the Worker at bnm-lab-relay.<subdomain>.workers.dev and
# every owner who pressed "Start" in Help > Remote support would get an
# UnknownHostException instead of a session. `custom_domain = true` makes
# Cloudflare create/own the DNS record for the hostname on deploy, so the route
# ships with the code rather than living in somebody's dashboard.
# RelayHostTest (composeApp desktopTest) fails if this and the constant drift.
[[routes]]
pattern = "lab-relay.bnmapp.com"
custom_domain = true

[observability]
enabled = true

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "LabSession"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "SessionDirectory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LabSession", "SessionDirectory"]
